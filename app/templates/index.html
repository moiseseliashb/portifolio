{% extends "layout/base.html" %}

{% block title %}Início | Portfólio{% endblock %}

{% block content %}
<main class="flex min-h-screen items-center justify-center px-6">
    <section class="max-w-3xl text-center">
        <p class="mb-4 text-sm font-medium uppercase tracking-[0.3em] text-lime-400">
            Portfólio pessoal
        </p>

        <h1 class="text-4xl font-bold tracking-tight sm:text-6xl">
            Olá, mundo!
        </h1>

        <p class="mt-6 text-lg text-gray-400">
            O meu próximo projeto está a nascer.
        </p>

        <a
            href="#projetos"
            class="mt-8 inline-flex rounded-full bg-lime-400 px-6 py-3
                   font-semibold text-black transition hover:bg-lime-300"
        >
            Explorar projetos
        </a>
    </section>
</main>
{% endblock %}
